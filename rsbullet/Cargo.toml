[package]
name = "rsbullet"
version = "0.6.0"
edition = "2024"
authors = [
    "Nathan Kent <nkent2@cs.rochester.edu>",
    "Marco Boneberger <m.boneberger@tu-bs.de>",
    "Yixing <yanjizhou312@163.com>",
]
homepage = "https://github.com/Robot-Exp-Platform/rsbullet"
readme = "../README.md"
license = "MIT"
description = "Compiles bullet3 and exposes rust bindings to the C API"
categories = ["science::robotics", "simulation"]
keywords = ["pybullet", "bullet", "bullet3", "physics", "robotics"]
exclude = [
    "bullet3/data/*",
    "!bullet3/data/sphere8.mtl",
    "bullet3/examples/pybullet",
    "bullet3/examples/ThirdPartyLibs/openvr",
    "bullet3/docs",
    "bullet3/test",
]

[dependencies]
rsbullet-core = { version = "0.6.0", path = "../rsbullet-core" }
rsbullet_sys = { version = "0.3.2", path = "../rsbullet-sys" }
nalgebra = { version = "0.34.1" }
robot_behavior = { version = "0.8.0", git = "ssh://git@github.com/Robot-Exp-Platform/robot_behavior.git", rev = "1f6bf80e6fa18cfb331ea5c18db790cc85ef8e8d" }
roplat = { version = "0.5.0", git = "ssh://git@github.com/Robot-Exp-Platform/roplat.git", rev = "d6484b1c595b7d69e8727dc04d471f4bbf57def4", optional = true }
anyhow = "1.0.100"
futures = "0.3"
tokio = { version = "1", features = ["time"] }

[features]
default = []
roplat = ["dep:roplat"]
dart = ["rsbullet-core/dart"]
physx = ["rsbullet-core/physx"]
mujoco = ["rsbullet-core/mujoco"]
grpc = ["rsbullet-core/grpc"]
enet = ["rsbullet-core/enet"]
clsocket = ["rsbullet-core/clsocket"]
